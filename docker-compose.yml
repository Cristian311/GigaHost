# Optional: a MySQL instance for machines without XAMPP.
# Development normally uses the MariaDB that ships with XAMPP, in which case
# this file is not needed — just create the databases and point DATABASE_URL at
# them (see README).
services:
  mysql:
    image: mysql:8.4
    container_name: gigahost-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: gigahost
      MYSQL_DATABASE: gigahost
      MYSQL_USER: gigahost
      MYSQL_PASSWORD: gigahost
    ports:
      - "3306:3306"
    volumes:
      - gigahost_mysqldata:/var/lib/mysql

volumes:
  gigahost_mysqldata:

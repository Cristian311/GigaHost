# Local Pterodactyl (Panel + Wings) for testing GigaHost with real game servers.
# LOCAL USE ONLY: the passwords below are not secret. Follow README.md in this folder.
name: gigahost-pterodactyl

services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: pterodactyl-local
      MYSQL_ROOT_PASSWORD: pterodactyl-root-local
    volumes:
      - ptero_db:/var/lib/mysql

  cache:
    image: redis:7-alpine
    restart: unless-stopped

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    depends_on: [database, cache]
    ports:
      - "8081:80"
    environment:
      # host.docker.internal resolves both inside containers and on Windows
      # (Docker Desktop adds it to the hosts file), so one URL works everywhere.
      APP_URL: "http://host.docker.internal:8081"
      APP_TIMEZONE: "Europe/Bucharest"
      APP_SERVICE_AUTHOR: "admin@gigahost.local"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_PASSWORD: "pterodactyl-local"
      TRUSTED_PROXIES: "*"
      MAIL_DRIVER: "log"
    volumes:
      - ptero_var:/app/var
      - ptero_nginx:/etc/nginx/http.d
      - ptero_logs:/app/storage/logs

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    restart: unless-stopped
    tty: true
    ports:
      - "8080:8080" # daemon API + console websocket
      - "2022:2022" # SFTP
    environment:
      TZ: "Europe/Bucharest"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pterodactyl
    volumes:
      # Wings starts game containers through the host Docker daemon. The data
      # paths must be identical inside and outside this container.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/
      - /var/lib/pterodactyl/:/var/lib/pterodactyl/
      - /var/log/pterodactyl/:/var/log/pterodactyl/
      - /tmp/pterodactyl/:/tmp/pterodactyl/
      # config.yml is generated by the panel (see README step 6).
      - ./wings:/etc/pterodactyl/

volumes:
  ptero_db:
  ptero_var:
  ptero_nginx:
  ptero_logs:
